version: '3.8'

services:
  api:
    build: ./apps/api
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - NODE_ENV=production
      - AI_PROVIDER=demo
    volumes:
      - ./apps/api:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "5175:5175"
    environment:
      - VITE_API_BASE=http://localhost:4002
    volumes:
      - ./apps/web:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
